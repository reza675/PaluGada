runtime: nodejs20
service: projekahirtcc-frontend

handlers:
  # Ini buat nanganin file statis kayak CSS, JS, Gambar
  - url: /(.*\..+)$
    static_files: dist/\1
    upload: dist/(.*\..+)$

  # Ini buat nanganin rute React supaya nggak error 404
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html

# Tambahkan ini supaya hemat (untuk testing)
automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 1
